# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-flwr"
version = "1.0.0"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.23.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "tuan"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "rl_flwr.server_app:app"
clientapp = "rl_flwr.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 50
fraction-train = 1
fraction-evaluate = 1
local-epochs = 10
server-device = "cuda"
anom-decay = 0.6
tau-s-quantile = 0.8
attack-mode = "gaussian" 


